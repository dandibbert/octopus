name: Responses Function Call Fix Test Image

on:
  push:
    branches:
      - build/responses-fc-test-image-20261122

permissions:
  contents: read
  packages: write

concurrency:
  group: responses-fc-test-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build frontend
        shell: bash
        run: |
          pnpm --dir web install --frozen-lockfile
          NEXT_PUBLIC_APP_VERSION="$(cat VERSION)-responses-fc-test" \
          NEXT_PUBLIC_GITHUB_REPO="https://github.com/dandibbert/octopus" \
          pnpm --dir web build
          rm -rf static/out
          mv web/out static/out

      - name: Build backend for amd64 and arm64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/docker/linux/amd64 build/docker/linux/arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags=jsoniter -ldflags="-s -w" -o build/docker/linux/amd64/octopus ./
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags=jsoniter -ldflags="-s -w" -o build/docker/linux/arm64/octopus ./

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish isolated test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./scripts/dockerfiles/Dockerfile.debian
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/dandibbert/octopus:responses-fc-test-7f182c7
          labels: |
            org.opencontainers.image.source=https://github.com/dandibbert/octopus
            org.opencontainers.image.revision=${{ github.sha }}
